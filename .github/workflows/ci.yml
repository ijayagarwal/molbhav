name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # convex/_generated is committed, so CI typechecks without a Convex deployment or deploy key.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  size:
    # Performance budgets (DESIGN §15, §20): fonts and client JS, via size-limit on a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The dev deployment's public URL (it ships in every client bundle anyway). The /app measurement
          # below loads the page as a signed-out visitor, so `contractors.me` returns null and onboarding loads
          # exactly as it does for a new contractor. Nothing is written.
          NEXT_PUBLIC_CONVEX_URL: https://adorable-clam-29.convex.cloud
      - run: pnpm size
      # The real budget (DESIGN §20): /app's first render, fonts ≤ 250 KB and JS ≤ 200 KB, on a Pixel 7 profile.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure /app's first render
        run: |
          pnpm start &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          pnpm measure http://localhost:3000 /app
