name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # convex/_generated is committed, so CI typechecks without a Convex deployment or deploy key.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  size:
    # Performance budgets (DESIGN §15, §20): fonts and client JS, via size-limit on a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The build needs a Convex URL to compile the client provider; nothing connects to it in CI.
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      - run: pnpm size
