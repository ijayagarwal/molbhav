<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm order</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&amp;family=Mukta:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#15120E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F2E9; color: #15120E; font-family: 'Mukta', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 64px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #D8D0C2">
    <a href="Main.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 26px">ये सही है?</h1>
  </header>

  <main style="flex: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <p style="margin: 0; flex: 1; font-size: 15px; line-height: 23px; color: #45403A">“कल सुबह तक 2 टन 12mm सरिया Fe500D और 150 बोरी PPC सीमेंट, मानसरोवर वाली साइट पे, 15 दिन का उधार”</p>
      <button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap">ठीक कीजिए</button>
    </div>

    <article style="background: #FFFFFF; border: 1px solid #D8D0C2; border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 21px">TMT सरिया</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px">2 टन</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 56px; padding: 0 16px; border-radius: 12px; border: 0; background: #15120E; color: #F6F2E9; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">12mm</button>
        <button aria-pressed="true" style="height: 56px; padding: 0 16px; border-radius: 12px; border: 0; background: #15120E; color: #F6F2E9; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">Fe500D</button>
      </div>
      <div style="font-size: 15px; font-weight: 600; color: #45403A">कौन सा सरिया?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="false" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">ब्रांडेड</button>
        <button aria-pressed="true" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 0; background: #15120E; color: #F6F2E9; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">लोकल ISI</button>
        <button aria-pressed="false" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">दोनों का रेट</button>
      </div>
    </article>

    <article style="background: #FFFFFF; border: 1px solid #D8D0C2; border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 21px">PPC सीमेंट</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px">150 बोरी</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 56px; padding: 0 16px; border-radius: 12px; border: 0; background: #15120E; color: #F6F2E9; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">PPC</button>
        <button aria-pressed="false" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 2px dashed #93180F; background: #FFFFFF; color: #93180F; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">नामी कंपनी?</button>
        <button aria-pressed="false" style="height: 56px; padding: 0 14px; border-radius: 12px; border: 2px dashed #93180F; background: #FFFFFF; color: #93180F; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 16px">कोई भी?</button>
      </div>
    </article>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #E9E3D7; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #45403A">साइट</span><span style="font-size: 16px; font-weight: 600">मानसरोवर</span>
      </div>
      <div style="background: #E9E3D7; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #45403A">कब तक</span><span style="font-size: 16px; font-weight: 600">कल सुबह</span>
      </div>
      <div style="background: #E9E3D7; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #45403A">उधार</span><span style="font-size: 16px; font-weight: 600">15 दिन</span>
      </div>
    </div>

    <button style="align-self: flex-start; height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-size: 16px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      सुनिए
    </button>
  </main>

  <footer style="padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #D8D0C2">
    <a href="Sweep.html" style="height: 64px; border-radius: 12px; background: #FFC61A; border: 2px solid #15120E; box-shadow: 3px 3px 0 #15120E; color: #15120E; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 20px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      हाँ, मोलभाव शुरू कीजिए
    </a>
    <div style="text-align: center; font-size: 15px; color: #45403A">या बोलिए “हाँ”</div>
  </footer>
</div>
</body>
</html>
