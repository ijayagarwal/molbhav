<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&amp;family=Mukta:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#15120E}
@keyframes lvl{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.bar{transform-origin:center;animation:lvl .9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bar{animation:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15120E; font-family: 'Mukta', sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0 0 auto 0; height: 220px; padding: 16px; color: #CFC6B8; font-size: 15px" aria-hidden="true">
    <div style="font-family: 'Anek Devanagari', sans-serif; font-weight: 800; font-stretch: 125%; font-size: 26px; color: #A39A8C">मोलभाव</div>
  </div>

  <section aria-label="Recording" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; background: #F6F2E9; color: #15120E; border-radius: 20px 20px 0 0; padding: 14px 20px 28px; display: flex; flex-direction: column; align-items: center">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #D8D0C2" aria-hidden="true"></div>

    <div style="margin-top: 22px; display: flex; align-items: center; gap: 10px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #93180F" aria-hidden="true"></span>
      <span style="font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 26px">सुन रहे हैं…</span>
    </div>
    <div style="margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 40px; letter-spacing: 1px">0:07</div>
    <div style="font-size: 14px; color: #45403A">25 सेकंड तक बोल सकते हैं</div>

    <div style="margin-top: 26px; height: 96px; display: flex; align-items: center; gap: 6px" aria-hidden="true">
      <span class="bar" style="width: 8px; height: 40px; background: #15120E; border-radius: 4px; animation-delay: -.1s"></span>
      <span class="bar" style="width: 8px; height: 72px; background: #15120E; border-radius: 4px; animation-delay: -.5s"></span>
      <span class="bar" style="width: 8px; height: 56px; background: #15120E; border-radius: 4px; animation-delay: -.3s"></span>
      <span class="bar" style="width: 8px; height: 92px; background: #15120E; border-radius: 4px; animation-delay: -.7s"></span>
      <span class="bar" style="width: 8px; height: 64px; background: #15120E; border-radius: 4px; animation-delay: -.2s"></span>
      <span class="bar" style="width: 8px; height: 84px; background: #15120E; border-radius: 4px; animation-delay: -.6s"></span>
      <span class="bar" style="width: 8px; height: 48px; background: #15120E; border-radius: 4px; animation-delay: -.4s"></span>
      <span class="bar" style="width: 8px; height: 70px; background: #15120E; border-radius: 4px; animation-delay: -.8s"></span>
      <span class="bar" style="width: 8px; height: 36px; background: #15120E; border-radius: 4px"></span>
    </div>

    <p style="margin: 18px 0 0; text-align: center; font-size: 17px; line-height: 27px; color: #45403A">आराम से बोलिए, रुक-रुक के बोल सकते हैं।<br>छोड़ते ही हम समझ लेंगे।</p>

    <div style="flex: 1"></div>

    <div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #45403A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#45403A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        रद्द करने के लिए खिसकाइए
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #45403A">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        लॉक
      </div>
    </div>

    <div style="margin-top: 14px; position: relative; width: 104px; height: 104px">
      <span style="position: absolute; inset: -10px; border-radius: 50%; border: 4px solid #93180F" aria-hidden="true"></span>
      <a href="Confirm.html" aria-label="Release to send" style="position: absolute; inset: 0; border-radius: 50%; background: #FFC61A; border: 2px solid #15120E; display: flex; align-items: center; justify-content: center; transform: scale(1.08)">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
      </a>
    </div>
    <div style="margin-top: 12px; font-size: 16px; font-weight: 600">छोड़िए तो भेज देंगे</div>
  </section>
</div>
</body>
</html>
