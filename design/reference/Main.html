<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molbhav home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&amp;family=Mukta:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#15120E}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.ring{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ring{animation:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F2E9; color: #15120E; font-family: 'Mukta', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #D8D0C2">
    <div style="font-family: 'Anek Devanagari', sans-serif; font-weight: 800; font-stretch: 125%; font-size: 26px; line-height: 1; text-shadow: 0.08em 0.08em 0 #FFC61A">मोलभाव</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: #E9E3D7; color: #45403A">DEMO</span>
      <button aria-label="Language: English" style="height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 15px">EN</button>
    </div>
  </header>

  <main style="flex: 1; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <div>
      <div style="font-size: 16px; color: #45403A; font-weight: 500">नमस्ते रमेश जी</div>
      <h1 style="margin: 2px 0 0; font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 30px; line-height: 40px">आज क्या मंगवाना है?</h1>
    </div>

    <button style="align-self: flex-start; height: 48px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; border-radius: 12px; border: 1px solid #D8D0C2; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-size: 16px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      मानसरोवर साइट
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#45403A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <section style="background: #FFFFFF; border: 1px solid #D8D0C2; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 15px; font-weight: 600; color: #45403A">ऐसे बोलिए</div>
      <p style="margin: 0; font-size: 19px; line-height: 30px; font-weight: 500">“कल सुबह तक 2 टन 12mm सरिया Fe500D और 150 बोरी PPC, मानसरोवर साइट पे, 15 दिन उधार”</p>
      <button style="align-self: flex-start; height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; border: 1.5px solid #15120E; background: #FFFFFF; color: #15120E; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#15120E" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>सुनिए
      </button>
    </section>

    <section>
      <h2 style="margin: 0 0 6px; font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 20px">पिछले ऑर्डर</h2>
      <a href="Result.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; border-top: 1px solid #D8D0C2; border-bottom: 1px solid #D8D0C2; color: #15120E; text-decoration: none">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 17px; font-weight: 600">TMT 12mm + PPC</span>
          <span style="font-size: 14px; color: #45403A">12 नव · जगतपुरा · अग्रवाल ट्रेडर्स</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end">
          <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">₹1,96,200</span>
          <span style="font-size: 14px; color: #115533; font-weight: 600">पक्का</span>
        </div>
      </a>
    </section>
  </main>

  <a href="Sweep.html" style="margin: 0 16px 12px; min-height: 56px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-radius: 12px; border: 1.5px solid #1E3A8A; background: #FFFFFF; color: #1E3A8A; text-decoration: none; font-weight: 600; font-size: 16px">
    <span style="display: flex; align-items: center; gap: 10px">
      <span style="display: flex; gap: 3px; align-items: center; height: 18px" aria-hidden="true"><span style="width: 3px; height: 8px; background: #1E3A8A; border-radius: 2px"></span><span style="width: 3px; height: 16px; background: #1E3A8A; border-radius: 2px"></span><span style="width: 3px; height: 11px; background: #1E3A8A; border-radius: 2px"></span><span style="width: 3px; height: 14px; background: #1E3A8A; border-radius: 2px"></span></span>
      मोलभाव चल रहा है · 3/4 रेट मिले
    </span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <footer style="padding: 14px 16px 28px; border-top: 1px solid #D8D0C2; background: #F6F2E9; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="position: relative; width: 88px; height: 88px">
      <span class="ring" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #FFC61A" aria-hidden="true"></span>
      <a href="Listening.html" aria-label="Hold to speak your order" style="position: absolute; inset: 0; border-radius: 50%; background: #FFC61A; box-shadow: 3px 3px 0 #15120E; border: 2px solid #15120E; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#15120E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
      </a>
    </div>
    <div style="font-size: 17px; font-weight: 600">दबाइए और बोलिए</div>
    <button style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #45403A; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#45403A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      लिख के बताइए
    </button>
  </footer>
</div>
</body>
</html>
