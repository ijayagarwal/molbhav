<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>मोलभाव · नेटवर्क नहीं</title>
<style>
  /* Token colours (DESIGN §5): paper, ink, ink-2, haldi. */
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F2E9; color: #15120E; font-family: system-ui, sans-serif; }
  main { max-width: 360px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 28px; margin: 0; }
  p { font-size: 17px; line-height: 27px; margin: 0; color: #45403A; }
  button { margin-top: 8px; height: 56px; border-radius: 12px; border: 2px solid #15120E; background: #FFC61A; font-size: 17px; font-weight: 700; box-shadow: 3px 3px 0 #15120E; }
</style>
</head>
<body>
<main>
  <h1>नेटवर्क नहीं है</h1>
  <p>आपका ऑर्डर सर्वर पे सेव है। नेटवर्क आते ही फिर से खोलिए।</p>
  <p lang="en">No network. Your order is saved on our side; open it again when you're back online.</p>
  <button type="button" onclick="location.reload()">फिर से खोलिए · Try again</button>
</main>
</body>
</html>
